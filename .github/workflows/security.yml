name: security-scan
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  security-events: write
jobs:
  codeql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          # This private repository does not currently have GitHub Code Scanning
          # enabled. Keep the analysis and retain its SARIF rather than silently
          # dropping the scan or failing after analysis during the unavailable upload.
          upload: never
          upload-database: false
          output: ${{ runner.temp }}/codeql-results
      - name: Retain CodeQL SARIF
        uses: actions/upload-artifact@v4
        with:
          name: codeql-sarif
          path: ${{ runner.temp }}/codeql-results
          if-no-files-found: error
          retention-days: 30
  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6
      - name: Filesystem vulnerabilities, secrets and misconfiguration
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
      - name: Build release image
        run: docker build -t hodgeform:security .
      - name: Container vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: hodgeform:security
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
